; Bodyguard Mod settings
; Keys accept names like F7, J, K, NUMPAD5 or raw virtual-key numbers (e.g. 118)

[Keys]
MenuKey=F7
AttackKey=J
RegroupKey=K
; Call the driver, start the drive to your waypoint, or toggle hurry while he is driving you
DriverKey=L
; Heli guards rappel down to you
RappelKey=U

[Guards]
; Model used by default in the spawn menu (all built-in models wear suits):
; s_m_m_highsec_01, s_m_m_highsec_02, u_m_m_jewelsec_01, s_m_y_devinsec_01, s_m_m_ciasec_01, s_m_m_fiboffice_01, ig_fbisuit_01
DefaultModel=s_m_m_highsec_01
; Optional extra model added to the spawn list (any ped model name)
CustomModel=
; WEAPON_PISTOL, WEAPON_COMBATPISTOL, WEAPON_SMG, WEAPON_CARBINERIFLE, WEAPON_ASSAULTRIFLE,
; WEAPON_PUMPSHOTGUN, WEAPON_COMBATMG, WEAPON_SNIPERRIFLE, WEAPON_RPG, WEAPON_MINIGUN
DefaultWeapon=WEAPON_CARBINERIFLE
Accuracy=60
Health=300
Armour=100
Invincible=0
InfiniteAmmo=1
Blips=1
; Delete all guards when you die or get arrested
DismissOnDeath=1

[Vehicles]
; EscortCar  = spawn an escort vehicle for guards that don't fit in your car
; NearbyCars = guards take the nearest empty parked car
; Auto       = try a nearby car first, spawn one if there is none
FollowMode=Auto
EscortModel=granger
CustomEscortModel=
; Teleport escort cars behind you when they fall too far behind
CatchUpTeleport=1
CatchUpDistance=200
; Driving style flags for escort drivers (1074528293 = rushed, 786603 = normal)
DrivingStyle=1074528293
; Max speed (m/s) for overflow escort cars. Motorcade cars match your speed via gap control instead.
EscortSpeed=35

[Combat]
; Guards attack anyone who attacks you or them
AutoDefend=1
DefendRadius=80

[Driver]
; schafter6, cog552, stretch, baller6, washington, granger
CarModel=schafter6
DriverModel=s_m_m_highsec_01
; What the driver does when you get out: StayInCar, GuardCar, FollowYou
ExitBehaviour=StayInCar
; Normal or Hurry (like telling a taxi to hurry; toggle in the menu or press DriverKey mid-trip)
DrivingStyle=Normal

[Motorcade]
LeadCars=1
RearCars=1
; Guards per car, including the driver (2-4)
GuardsPerCar=3
CarModel=granger
; When YOU drive: LeadToWaypoint (a lead car drives to your map waypoint and you follow it; no waypoint = follow behind)
; or FollowBehind (every car chains behind you)
DriveFormation=LeadToWaypoint
; Hurry: Auto (match your driver / hurry when you drive fast), On, Off
Hurry=Auto
; Guards get out and walk around you when you stop on foot (0 = stay in the cars, only get out to fight)
GetOut=0

[Heli]
; Guard helicopter (must support rappelling): maverick, polmav, annihilator
GuardHeliModel=maverick
GuardHeliCount=1
; Luxury transport helicopter: swift2, volatus, supervolito2, supervolito
TransportModel=swift2
; Guard helis that fly in formation with the transport (0-2)
EscortHelis=1
; After dropping you off: Wait or Leave
AfterDropOff=Wait
; Minimum height (m) for rappelling
RappelHeight=10
